# Three coverage sources, three flags (see .github/workflows/ci.yml):
#   backend       — pytest --cov over src/
#   frontend      — vitest unit coverage over tools/gui/src (logic dirs gated in vite.config.ts)
#   frontend-e2e  — Playwright route-walk reachability coverage (instrumented build)
#
# carryforward: a run that doesn't re-upload a flag keeps that flag's last-known
# coverage instead of dropping it from the merged number — without it the overall
# badge swings depending on which jobs happened to upload.
comment: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true
