[project]
name = "architectonic"
version = "0.5.1"
description = "Architectonic — architecture as code for humans and AI: a typed, verifiable, git-versioned model with MCP, REST, CLI, and GUI access, plus safety/security/GRC assurance."
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
# Deliberately not licenses/texts/*.txt: those are reference copies of the licenses that
# govern components a BUILD assembles (Debian packages, the PlantUML jar, PyPI deps), none
# of which this wheel conveys. Declaring them here would have metadata scanners read the
# wheel itself as copyleft.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "mcp>=1.28.1",
    "python-frontmatter>=1.1.0",
    "anyio>=4.0",
    "jsonschema>=4.0",
    "sqlcipher3>=0.5.0",
    "keyring>=25.0",
    "keyrings.alt>=4.0",
    "httpx>=0.25",
    "cryptography>=48.0.1",
    "defusedxml>=0.7.1",
    "lxml>=6.1.1",
    "cvss>=3.6",
    "packageurl-python>=0.17.6",
]


[project.scripts]
arch-backend = "src.infrastructure.backend.arch_backend:main"
arch-mcp-stdio-read = "src.infrastructure.mcp.arch_mcp_stdio:main"
arch-mcp-stdio-write = "src.infrastructure.mcp.arch_mcp_stdio_write:main_write"
arch-init = "src.infrastructure.workspace.workspace_init:main"
arch-switch-engagement = "src.infrastructure.workspace.switch_engagement:main"
get-plantuml = "src.infrastructure.bootstrap.get_plantuml:main"
get-diagram-runtime = "src.infrastructure.bootstrap.get_diagram_runtime:main"
check-diagram-runtime = "src.infrastructure.bootstrap.check_diagram_runtime:main"
arch-write-cli = "src.infrastructure.write.artifact_write_cli:main"
arch-assurance = "src.infrastructure.cli.arch_assurance:main"
arch-repair = "src.infrastructure.cli.arch_repair:main"
arch-mcp-stdio-assurance-read = "src.infrastructure.mcp.arch_mcp_stdio_assurance:main_read"
arch-mcp-stdio-assurance-write = "src.infrastructure.mcp.arch_mcp_stdio_assurance:main_write"
arch-import-guidance = "src.infrastructure.cli.arch_import_guidance:main"
arch-exchange = "src.infrastructure.cli.arch_exchange:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    ".arch",
    ".venv",
    "engagements",
    "enterprise-repository",
    "tests",
    "tools/gui",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "perf_manual: opt-in, machine-dependent performance benchmarks; enable with ARCH_PERF_MANUAL=1",
    # Names the self-model requirement a test verifies, so `requirement -> realising component ->
    # verifying artefact` is a chain the suite can close. Held by
    # tests/architecture/test_requirements_have_verifiers.py; `-m verifies` selects them.
    "verifies(requirement_id): the self-model requirement this test verifies (REQ@epoch.random)",
    # Starts a real backend subprocess and drives the write surface through it. Named so a developer
    # can `-m "not slow_walk"` while iterating; it stays in the default run because the surface it
    # covers has no other oracle.
    "slow_walk: drives a real backend subprocess (~20s); the REST write walk",
]
# A warning nobody reads is a warning that hides the next one. Twenty identical
# `StarletteDeprecationWarning`s scrolled past every run, which is exactly enough noise to make a
# real `DeprecationWarning` — from our own code, about behaviour that is going to change — invisible.
# So: unknown warnings are errors, and each exception is narrow and says why.
filterwarnings = [
    "error",
    # `starlette.testclient` asks for `httpx2`; 59 test modules use it, and the choice of HTTP client
    # backing a test helper is not ours to make in a patch. Narrowed to the one message, and to the
    # class Starlette actually raises — `StarletteDeprecationWarning` derives from `UserWarning`, not
    # from `DeprecationWarning`, so naming the latter matched nothing.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # `ArtifactIndex` now *has* a `close()` — the lifecycle it was missing, declared on
    # `ArtifactIndexLifecycle`, delegated by the repository facade, and named as a step in the
    # backend's teardown, so a served process no longer holds one shared-cache database plus a reader
    # pool per index for its whole life. That was the leak worth fixing and it is fixed.
    #
    # These stay because *tests* construct indices and mostly do not close them: **343 of 347 call
    # sites** as of 2026-08-02, each of which would need the context manager or an explicit close. The
    # remaining warnings are therefore about test hygiene rather than about the product, which is a
    # different and much smaller problem — and one an `error` here cannot help with, since
    # `ResourceWarning` fires at collection time and so fails whichever test the collector happened to
    # be inside rather than the one that leaked. Both messages: pytest wraps the unraisable one.
    #
    # Counted rather than estimated, because "several hundred" is the kind of figure that justifies not
    # doing something without anyone checking it. It is a real 343, and converting them is a diff across
    # a seventh of the suite that changes no behaviour and can silently shorten an index's lifetime
    # inside a test that still needs it. Left undone on purpose, with the number attached so the trade
    # can be re-judged rather than re-guessed.
    #
    # `tests/infrastructure/artifact_index/test_index_close_releases_connections.py` asserts both
    # directions locally, so neither the fix nor the leak can be silently reversed behind these.
    "ignore:unclosed database:ResourceWarning",
    "ignore:Exception ignored while finalizing database connection:pytest.PytestUnraisableExceptionWarning",
]
# Coverage is opt-in to keep the default quality-gate run fast. Enable with:
#   uv run pytest --cov            (terminal summary with missing lines)
#   uv run pytest --cov --cov-report=html   (browsable htmlcov/ report)
# The --cov flag needs no argument; the measured package is configured below.

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__pycache__/*",
    "src/infrastructure/gui/gui_server.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
# Coverage bases (measured 2026-08-11): 90.2% statement/line · 87.8% combined · 66% branch.
# Because branch=true above, coverage.py's headline `percent_covered` (and therefore
# `fail_under`) is the branch-INCLUSIVE combined metric, not the line figure — do not compare
# a line-basis target against it. Codecov reports a third number again (86.2%), counting a
# partially-branched line as uncovered where the line metric counts it covered.
# `fail_under` is a ratchet for explicit `--cov` runs only; it never blocks the default
# (no-coverage) quality-gate run. Raise it as coverage improves, keeping a couple of points of
# headroom so an unlucky run is not a red build.
fail_under = 85
# Only lines that genuinely cannot be exercised by tests. Each pattern below was
# checked against src/: TYPE_CHECKING blocks (30, import-only), abstract method
# bodies (6), __main__ entry guards (16), and bare `...` Protocol/stub bodies.
# The ellipsis pattern is anchored to a whole line so it never swallows real
# `tuple[str, ...]` annotations.
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.zuban]
mode = "default"
python_version = "3.13"
files = [
    "src",
    # Development-time policy modules a fitness function imports. They carry real logic — a route
    # matcher, a baseline register — so the reason the two older ones sit under `src` was that this
    # list said `src`. Named here instead, so a dev-only module need not ship in the wheel to be
    # type-checked. The rest of `tools/` is not yet clean under zuban.
    "tools/quality",
]
exclude = "(^|/)(\\.arch|\\.venv|engagements|enterprise-repository|tools/gui)(/|$)"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true

[project.optional-dependencies]
s3-archive = ["boto3>=1.34"]
azure-archive = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
cloud-archive = ["boto3>=1.34", "azure-storage-blob>=12.19", "azure-identity>=1.15"]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.3",
    "pytest-bdd>=7.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15.11",
    "zuban>=0.7.0",
    "moto[s3]>=5.0",
    "boto3>=1.34",
    "cyclonedx-bom>=7.3.0",
    "pytest-split>=0.11.0",
]
gui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
