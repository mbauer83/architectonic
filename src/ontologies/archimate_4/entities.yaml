# Entity Ontology — ArchiMate 4.0 entity type definitions
#
# Single source of truth for entity type metadata, classification hierarchy,
# and domain assignments.  Loaded by src/ontologies/archimate_4/_loader.py.
#
# Fields per entity type:
#   prefix              – short ID prefix (e.g. STK, DRV)
#   hierarchy           – domain-level path segments under model/; the loader
#                         appends the artifact_type name as the final segment
#   element_classes     – ArchiMate 4.0 abstract classification classes
#   create_when         - A brief description for when to model something as this type
#   never_create_when   - A brief description for when never to model something as this type

# ArchiMate layer hierarchy for canvas ordering: motivation above strategy, both
# above business/application/technology which center around common; implementation
# & migration outermost. Not strictly one-dimensional, but the reading order is.
domain_order: [motivation, strategy, business, common, application, technology, implementation]

# The levels this ontology classifies an element through, and what each governs. It restates
# nothing: `from:` names data declared elsewhere in this file (`hierarchy`, the type key) or in
# `specializations.yaml`. What it adds is the characterisation no consumer could previously ask for
# — which level relationships are keyed on, which merely narrows them, which carry attributes, and
# which must be reached before an element is complete.
#
# The keying level is what makes the two-tier verification a consequence rather than a special case:
# a pair the *entity type* forbids is E126 and blocks, while one a *specialization* forbids is
# W128/W129 and warns, because a specialization may only narrow what its parent permits.
#
# Omitting this block is legitimate and gives the derived default, which is exactly this shape —
# see `domain.ontology_representation.classification_levels`.
classification_levels:
  - id: domain
    label: Domain
    from: hierarchy
    required: true
  - id: entity_type
    label: Entity type
    from: type
    required: true
    keys_relationships: true
    carries_attributes: true
  - id: specialization
    label: Specialization
    from: specializations
    required: false
    narrows_relationships: true
    carries_attributes: true

element_classes:
  motivation-element:
    description: ArchiMate motivation layer element
  structure-element:
    description: Static structural element (ArchiMate)
  behavior-element:
    description: Dynamic/behavioral element (ArchiMate)
  strategy-behavior-element:
    description: Strategy-layer behavioral element
  active-structure-element:
    description: Active structure element that can perform behavior
  internal-active-structure-element:
    description: Active structure element that is internal to the enterprise
  external-active-structure-element:
    description: Active structure element that is external (interface)
  technology-internal-active-structure-element:
    description: Technology-layer internal active structure element
  passive-structure-element:
    description: Passive structure element (data, objects, artifacts)
  composite-element:
    description: Composite element that aggregates others (products, plateaus)
  internal-behavior-element:
    description: Behavioral element representing internal behavior
  junction:
    description: Junction element for combining or splitting relationships
  internal:
    description: Internal system element not directly modelable by users

# ── How elements are drawn ────────────────────────────────────────────────────
# The two visual properties that carry meaning. Declared here because they are facts about this
# vocabulary, and because they were previously hardcoded — the colours three times, in the PUML
# generator and twice in the frontend, disagreeing on every domain, with one copy missing
# `implementation` so those elements rendered grey in the graph explorer.
#
# ArchiMate assigns no formal semantics to colour and defines no hex values: the layer colours in
# the specification's own figures are conventional, and colour is explicitly left to the modeller.
# These are therefore *this product's* declaration rather than an approximation of a normative
# palette, which is what makes one central statement of them the right answer.
element_appearance:
  domain_colors:
    motivation: '#D1BADC'
    strategy: '#EFBD5D'
    business: '#EDD779'
    application: '#B0D0D9'
    technology: '#BCD9AE'
    implementation: '#F1BBB7'
    common: '#E5DFD3'

  # Corner shape says what kind of thing an element is: structure is drawn square, behaviour
  # rounded, motivation with cut corners. Keyed on the classes entity types already declare, in the
  # shape `behavioral_element_classes` established — a short list per category rather than a
  # property repeated on forty types.
  corner_classes:
    rounded:
      - behavior-element
      - internal-behavior-element
      - strategy-behavior-element
    diagonal:
      - motivation-element
    square:
      - structure-element
      - active-structure-element
      - internal-active-structure-element
      - external-active-structure-element
      - technology-internal-active-structure-element
      - passive-structure-element
      - composite-element

  # One rule for muting a colour, so a surface that needs a de-emphasized variant derives it rather
  # than carrying a second palette — which is how the three disagreeing ones came about.
  de_emphasis:
    toward: '#FFFFFF'
    amount: 0.55

# ── Which elements act ────────────────────────────────────────────────────────
# A behavioural element is one that does something which can be done well or badly: a component, a
# service, a function, a process, a device. Declared here because it is a fact about ArchiMate's own
# vocabulary; consumers ask for the resolved set and never see a class name. The failure-mode
# surfaces are the first caller — a failure mode enumerates ways something malfunctions, and a goal
# does not malfunction, it is met or missed.
behavioral_element_classes:
  - active-structure-element   # its own description: "can perform behavior"
  - behavior-element

# Subtracted because ArchiMate's taxonomy is coarser than the question here: capability, course of
# action and value stream all declare `behavior-element` alongside this one, and a capability does
# not malfunction — it is held or missing.
non_behavioral_element_classes:
  - strategy-behavior-element

# Additive, for a type whose class does not capture that it acts. Empty: the classes above resolve
# every case in this ontology today, and an entry here is a hint that the taxonomy wants attention.
behavioral_element_types: []

# Subtractive counterpart, for a class that is ever mostly behavioural with one exception inside it.
# Empty for the same reason. An explicit exclusion here outranks an explicit inclusion above.
non_behavioral_element_types: []


