name: activity
includes: []
grouping: {}
layout:
  # Points at which a step label wraps. Narrower than the shared default because a swimlane's
  # width is paid for by every lane beside it; 0 disables wrapping.
  # See infrastructure.rendering.puml_label_wrapping.
  wrap_width: 180
element_classes:
  step:
    description: An entity type that can appear in a step sequence array
  grouping:
    description: A grouping or partitioning entity; appears as a top-level collection in diagram-entities
  annotation:
    description: An annotation attached to another entity as a named property
  control-flow:
    description: Participates in control flow within an activity
guidance:
  when_to_use: >-
    Use when modeling a process as a granular sequence of steps (actions, decisions, forks - potentially grouped in partitions)
    across parallel tracks (swimlanes). Suitable for business workflows, system interaction flows, or operational procedures.
  when_not_to_use: >-
    Do not use for static structure or high-level process modeling - prefer archimate for these cases.
  puml_notes:
    - >-
      Steps and lanes go in `diagram_entities`; the flow between them goes in `diagram_connections`,
      as objects of the form {id, conn_type, source, target} — the same shape the file persists.
      Declaring steps without connections yields a diagram of one step and a warning per orphan.
    - >-
      Every step needs a `step-in-lane` connection naming its swimlane, including decisions and
      forks. A step without one is emitted with a WARNING comment and lands in whichever lane was
      last active.
    - >-
      A decision needs three edges, not two: `step-then` to the first step of the true branch,
      `step-else` to the first step of the false branch, and a `step-flow` to the step the branches
      merge back into. Omitting the third leaves the branches dangling.
    - >-
      A loop is closed by pointing a decision *arm* (`step-then` or `step-else`) back at an earlier
      step. Do not use the decision's `step-flow` merge edge for this: that edge is not drawn as a
      return, so the picture shows an empty branch and the loop disappears. The decision closing the
      loop is drawn as the diamond at its foot — one arm goes round again, the other leaves.
    - >-
      What a drawn loop can hold: a body of any shape, including a decision with its own branches;
      one step on the way back; and every step of the loop in the *same* swimlane. A loop crossing a
      lane has its way back drawn through the steps it returns past, and a return path of two or more
      steps loses all but the last — both measured, so both are refused with the reason (W049) rather
      than drawn wrongly. Two steps returning to the same step cannot be drawn either: give the loop
      one way round and let the other path leave it.
    - >-
      Notes attach with `step-note-of`, whose *source* is the note and whose *target* is the step it
      annotates.
    - >-
      Long step labels widen their whole swimlane, so prefer short imperative labels and put the
      nuance in a note. `layout.wrap_width` bounds this, but wrapping every label is not a
      substitute for writing short ones.
    - |-
      Minimal example — two lanes, one decision:
        diagram_entities: {swimlane: [{id: you}, {id: system}],
          action: [{id: a1, label: Ask}, {id: a2, label: Answer}],
          decision: [{id: d1, condition: Known?, then_label: yes, else_label: no}]}
        diagram_connections: [
          {id: l1, conn_type: step-in-lane, source: a1, target: you},
          {id: l2, conn_type: step-in-lane, source: d1, target: you},
          {id: l3, conn_type: step-in-lane, source: a2, target: system},
          {id: f1, conn_type: step-flow, source: a1, target: d1},
          {id: t1, conn_type: step-then, source: d1, target: a2}]
ui:
  label: Activity Diagram
  description: UML activity diagram with swimlanes.
  entity_search_filter: false
  diagram_only_types:
    - entity_type: swimlane
      label: Swimlane
      plural: Swimlanes

    - entity_type: action
      label: Action
      plural: Actions

    - entity_type: decision
      label: Decision
      plural: Decisions

    - entity_type: fork
      label: Fork / Join
      plural: Forks

    - entity_type: partition
      label: Partition
      plural: Partitions

  type_ui_slots:
    step_editor: activity-steps
