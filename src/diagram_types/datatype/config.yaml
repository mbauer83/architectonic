name: datatype

guidance:
  when_to_use: >-
    Use to document data structures as a restricted UML class diagram. Model classifiers
    (Class, DataType, Enumeration, Primitive) with typed attributes and UML structural
    relations (association, aggregation, composition, generalization). A sum type / tagged
    union is an abstract classifier whose cases are joined by generalization and grouped by
    a generalization_set. Optionally bind classifiers to Data Object entities to trace
    fine-grained schema to architectural data elements. Suitable for domain models, API
    payloads, persisted record schemas, and value-type hierarchies.
  when_not_to_use: >-
    Do not use for process or interaction flows (use Sequence or Activity diagrams), for
    component or deployment views (use ArchiMate or C4), or for documenting operations
    and methods (this diagram is structure-only). Do not model infrastructure entities
    or services here.
  puml_notes:
    - >-
      Classifiers and generalization sets go in `diagram_entities`; every relation between them
      goes in `diagram_connections`, as objects of the form
      {id, conn_type, source, target, src_multiplicity?, tgt_multiplicity?, label?} — the same
      shape the file persists. A connection whose conn_type is outside the dt-* vocabulary is
      dropped without drawing anything.
    - >-
      The five relations and which end they read from: `dt-association` (plain line),
      `dt-aggregation` and `dt-composition` run **whole → part**, with the diamond drawn at the
      source; `dt-generalization` runs **child → parent**, with the hollow triangle at the target;
      `dt-dependency` runs user → used. Reversing a composition is the easiest mistake here and
      renders as a valid diagram saying the opposite thing.
    - >-
      An attribute's `type` is a discriminated union, never a bare string —
      {kind: primitive, name: "String"} or {kind: classifier, id: "CLF@…"}. Call
      artifact_query_datatype_types for the ids in scope. Each attribute also carries a stable
      `id` minted once and never displayed, so `name` stays freely renamable.
    - >-
      A sum type is not a classifier_kind: it is a classifier with is_abstract true whose cases
      point at it with `dt-generalization`, and those generalizations each name the same
      `generalization_set`. The set's {is_covering, is_disjoint} render as a constraint note on
      the parent; a set no generalization references renders nothing.
    - |-
      Minimal example — one abstract parent, two cases:
        diagram_entities: {classifier: [
            {id: shape, classifier_kind: class, is_abstract: true},
            {id: circle, classifier_kind: class,
             attributes: [{id: a1, name: radius, type: {kind: primitive, name: Number}}]},
            {id: square, classifier_kind: class}],
          generalization_set: [{id: gs1, is_covering: true, is_disjoint: true}]}
        diagram_connections: [
          {id: g1, conn_type: dt-generalization, source: circle, target: shape,
           generalization_set: gs1},
          {id: g2, conn_type: dt-generalization, source: square, target: shape,
           generalization_set: gs1}]

ui:
  label: Datatype Diagram
  description: A UML class diagram restricted to data structure (no operations).
  entity_search_filter: false
  type_ui_slots:
    datatype-editor: datatype-editor
  primitive_types:
    - String
    - Integer
    - Number
    - Boolean
    - Date
    - DateTime
    - UUID
  diagram_only_types:
    - entity_type: classifier
      label: Classifier
      plural: Classifiers
      # SINGLE SOURCE OF TRUTH for this type's editable descriptive metadata (a property of the
      # type, not of any view). The PATCH write-op whitelist and every edit surface derive from
      # this — nothing is hand-listed elsewhere. Structural fields (name, type, classifier_kind,
      # identity/keys, attribute order/existence) are deliberately absent: those are structural,
      # not descriptive metadata. `control` names the input widget; order here is presentation
      # order (role/summary first, note last).
      editable_metadata:
        entity:
          - { field: role, control: summary }
          - { field: provenance, control: text }
          - { field: tags, control: tags }
          - { field: note, control: notes }
        subparts:
          attributes:
            - { field: role, control: summary }
            - { field: multiplicity, control: text }
            - { field: optional, control: boolean }
            - { field: default, control: text }
            - { field: provenance, control: text }
            - { field: note, control: notes }
    - entity_type: generalization_set
      label: Generalization set
      plural: Generalization sets
