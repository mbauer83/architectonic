name: c4-component

guidance:
  when_to_use: >-
    Show the major components inside one container and how nearby people, systems, or containers
    interact with them. Use this for the C4 level-3 zoom into one container.
    Authoring steps: (1) create an application-component, service, or data-object entity for the
    container in scope; (2) create application-component, function, or service entities for each
    component inside it; (3) create model entities for persons, external systems, and peer containers
    as needed; (4) call artifact_authoring_guidance(diagram_type="c4-component") for the schema;
    (5) create the diagram — set _scope_entity_id to the scope container's entity_id, add components
    in the component array each with their entity_id, reference other elements similarly.
  when_not_to_use: >-
    Do not use when container-level structure is enough, when the audience needs implementation-level
    code structure, when you need full ArchiMate cross-layer semantics, or when you need a process
    flow such as a UML activity diagram.

  puml_notes:
    - >-
      Two modes, decided by one key. With `_scope_entity_id` set, the diagram is *model-backed*:
      the items and the relations between them are derived from the ArchiMate graph around that
      entity, and `diagram_entities` beyond the scope key is ignored — trim the result with
      `_included_entity_ids` or `_excluded_entity_ids` (never both; pass whichever set is smaller).
      Without it, the diagram is *standalone* and shows exactly what `diagram_entities` and
      `diagram_connections` declare.
    - >-
      Standalone relations go in `diagram_connections` as {id, source, target, label?}, where
      source and target are the **local `id`s** of items in `diagram_entities` — not entity ids,
      and not the aliases in the rendered PUML. A connection naming an id no item declares is
      dropped without drawing anything and without a warning, so a mistyped id reads as a missing
      arrow.
    - >-
      Exactly one item is the scope. Mark it with `scope: true`; with no marker the FIRST
      container in the array wins, so a diagram declaring two of them scopes itself to
      whichever happened to be authored first.
    - >-
      What sits inside the container boundary is exactly the items of the `component` type that are
      not marked `external: true`. Everything else — people, peer containers, other systems — is
      drawn outside it, so a component that belongs inside and renders outside is an `external`
      flag nobody meant to set.
    - >-
      Shape follows, in order: an explicit `shape`, then an inference from `technology` (a
      database or queue gets its own shape), then the item type's default. Naming the technology
      is usually enough and keeps the two consistent.
    - |-
      Minimal standalone example:
        diagram_entities: {container: [{id: sys, label: "Our API", scope: true}],
          component: [{id: web, label: Web, technology: "TypeScript"},
            {id: db, label: Store, technology: PostgreSQL}]}
        diagram_connections: [
          {id: r1, source: web, target: db, label: "reads and writes"}]

ui:
  label: C4 Component
  description: C4 level 3. Shows one container boundary and its internal components.
  entity_search_filter: false
  type_ui_slots:
    c4_editor: c4-editor-component
  diagram_only_types:
    - entity_type: person
      label: Person
      plural: People
    - entity_type: software-system
      label: Software System
      plural: Software Systems
    - entity_type: container
      label: Container
      plural: Containers
    - entity_type: component
      label: Component
      plural: Components

c4:
  scope_entity_type: container
  scope_render_mode: boundary
  internal_entity_types:
    - component
