- id: risk-and-compliance-officer
  name: Risk & Compliance Officer
  role:
    summary: >
      Answers customer security questionnaires and prepares for certification audits at
      a regulated small company. Thinks in applicable requirement, implemented control
      and evidence, and cannot use anything that does not end up in an evidence pack.
    setting: regulated small company driven by customer audits
    accountabilities:
    - audit readiness and certification evidence
    - control coverage against applicable frameworks
  expertise:
    architecture_modelling: aware
    solution_domain: working
    software_engineering: aware
    assurance_and_compliance: authority
    product_familiarity: none
  capabilities:
  - maps obligations to controls and controls to evidence
  - assembles and defends an evidence pack
  literacies:
  - control-framework vocabulary such as ISO 27001 and SOC 2
  - coverage tables and gap registers
  boundaries:
  - has no modelling background
  - will not include an unverifiable claim in an evidence pack
  focus:
  - audit readiness
  - control coverage
  - evidence trails
  channels: [gui, docs]
  information_strategy:
    entry_point: navigation labels containing compliance, requirement, control or evidence
    breadth: follows a documented procedure rather than exploring
    depth: reads procedures in full and exploratory material not at all
    verification: requires the export itself to carry the provenance
    dead_end_response: asks an engineer, and records that the tool did not answer
  decision_strategy:
    evidence_basis:
    - a coverage table in which gaps are stated, not implied
    - provenance that survives an auditor's challenge
    risk_posture: requires-evidence-trail
    abandonment: when nothing exportable can be produced
    delegation: hands the technical part to an engineer once the shape is agreed
  resources:
    task_actions: 25
    authoring_actions: 30
    session_shape: one session per evidence request, output filed immediately
  recurring_questions:
  - id: is-every-requirement-implemented
    text: Show evidence that every applicable requirement has an implementation path, and export it.
    information_need: An exportable coverage table mapping requirement to realizing elements or to a gap.
    decision_artifact: audit-evidence
  - id: what-does-this-policy-govern
    text: Which parts of the system does a given policy or standard actually govern?
    information_need: Traceability from a standard or policy document to the elements it governs.
    decision_artifact: audit-evidence

# ---------------------------------------------------------------------------
- id: safety-and-security-analyst
  name: Safety & Security Analyst
  role:
    summary: >
      Performs hazard and threat analysis for a product with assurance obligations.
      Reads architecture diagrams fluently without authoring them, follows control and
      data paths hop by hop, and treats a missing link as a finding rather than as a
      clean result.
    setting: product carrying safety and security assurance obligations
    accountabilities:
    - hazard and threat analyses and their traceability
    - identifying where controls are absent rather than merely unmodelled
  expertise:
    architecture_modelling: working
    solution_domain: fluent
    software_engineering: working
    assurance_and_compliance: authority
    product_familiarity: working
  capabilities:
  - performs STPA and STRIDE-style analyses
  - traces control and data paths across trust boundaries
  - distinguishes an absent control from an unmodelled one
  literacies:
  - architecture diagrams of all kinds
  - hazard, loss and control-structure notation
  boundaries:
  - does not author ArchiMate content
  - will not treat the absence of a link as evidence of safety
  focus:
  - security exposure
  - control coverage
  - hazard traceability
  channels: [gui, docs, mcp]
  information_strategy:
    entry_point: a security-relevant component named directly
    breadth: expands outward hop by hop rather than jumping between routes
    depth: asks what mediates each connection at every hop
    verification: checks whether the surface can distinguish absent from unmodelled
    dead_end_response: records the limit of the surface as part of the analysis
  decision_strategy:
    evidence_basis:
    - complete paths with the mediating elements named
    - explicit identification of what is missing
    risk_posture: requires-evidence-trail
    abandonment: rarely; the limit of the tool becomes part of the finding
    delegation: none
  resources:
    task_actions: 25
    authoring_actions: 30
    session_shape: one analysis session feeding a written risk assessment
  recurring_questions:
  - id: what-governs-this-security-relevant-component
    text: >
      Trace a security-relevant component to the requirements and controls that govern
      it and the technology it touches — and tell me what links are missing.
    information_need: A traceability neighbourhood with the missing links identified explicitly.
    decision_artifact: incident-note
  - id: what-sits-on-the-confidentiality-boundary
    text: Which components sit on the boundary between confidential content and the rest of the system?
    information_need: The boundary set between the confidential grouping and everything else.
    decision_artifact: design-review

# ---------------------------------------------------------------------------
- id: delegated-modelling-agent
  name: Delegated Modelling Agent
  role:
    summary: >
      An AI coding agent working through the MCP tool surface on an engineer's behalf,
      with no visual channel and no prior familiarity with this repository's content.
      Discovers what it can do by reading tool descriptions and schemas, and is
      answerable to an engineer who will act on what it reports without re-deriving it.
    setting: an engineer's session, delegated to an agent with MCP access
    accountabilities:
    - answering from what the model actually holds
    - saying plainly what the model does not hold
    - proposing model changes that would pass validation as written
  expertise:
    architecture_modelling: working
    solution_domain: aware
    software_engineering: fluent
    assurance_and_compliance: aware
    product_familiarity: aware
  capabilities:
  - reads tool descriptions and parameter schemas to work out what is available
  - issues many queries cheaply and composes their results
  - follows authoring guidance where the guidance is retrievable
  literacies:
  - JSON payloads and structured tool results
  - ArchiMate element and relationship vocabulary as exposed by the tools
  boundaries:
  - has no visual channel; a picture is not an answer it can consume
  - cannot see a label, a legend or a layout, only what a tool returns
  - is structurally prone to reading an empty result as an established absence
  focus:
  - answering the delegating engineer's question completely
  - not asserting anything the model does not support
  - proposing changes that fit the ontology rather than the agent's own taxonomy
  channels: [mcp, docs]
  information_strategy:
    entry_point: the tool list and its descriptions
    breadth: many parallel queries, widening the search vocabulary on an empty result
    depth: reads schemas and guidance payloads in full
    verification: re-queries by a second route before reporting an absence
    dead_end_response: asks the delegating engineer rather than guessing
  decision_strategy:
    evidence_basis:
    - identifiers and records returned by a tool
    - guidance the tools themselves supply about legal types and pairs
    risk_posture: verifies-before-acting
    abandonment: does not abandon; reports partial results with the gap named
    delegation: escalates an ambiguous requirement to the delegating engineer
  resources:
    task_actions: 60
    authoring_actions: 60
    session_shape: one uninterrupted run; cheap actions, expensive mistakes
  recurring_questions:
  - id: what-does-the-model-already-say-about-this
    text: What does the model already hold about the area this change touches?
    information_need: >
      The existing elements and relationships in the affected area, named by identifier,
      with an explicit statement of where the search may have missed something.
    decision_artifact: design-review
  - id: what-would-this-change-reach
    text: What would this change reach, according to the model?
    information_need: An impact set with the traversal semantics stated, not merely a list.
    decision_artifact: design-review
  - id: what-model-delta-does-this-need
    text: What model change does this design decision require, and would it be legal?
    information_need: >
      A proposed set of elements and relationships with types checked against the
      ontology's guidance, specific enough to apply as written.
    decision_artifact: model-delta
