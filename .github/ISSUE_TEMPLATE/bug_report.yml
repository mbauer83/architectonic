name: Bug report
description: Something broke or behaved wrongly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag (e.g. v0.1.0) or commit hash you run
    validations: { required: true }
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [docker compose (prod), docker compose (demo), local install]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact tool call / endpoint / view where it surfaced.
    validations: { required: true }
