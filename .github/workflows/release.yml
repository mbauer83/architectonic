name: Release

# Runs when a release tag is pushed. It publishes what `arch-update` verifies and installs: the built
# GUI bundle, a `SHA256SUMS` over every asset, and a build-provenance attestation for each. The tag's
# version must equal the project's, and the release notes are the changelog detail file the
# changelog gate already requires for every shipped version — so a release cannot reach the publish
# step without one. Not a quality gate: `ci.yml` is, and `AGENTS.md`'s list mirrors that file alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish the release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        # libsqlcipher-dev: uv sync builds sqlcipher3 from source, as in ci.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: The tag names the project's version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python3 -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "tag $GITHUB_REF_NAME names $tag_version but pyproject.toml says $project_version" >&2
            exit 1
          fi
          test -f "changelog-assets/${project_version}-detail.md" || { echo "no changelog-assets/${project_version}-detail.md" >&2; exit 1; }
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (all groups)
        # The GUI build regenerates the frontend types from the ontology through `uv run`, which
        # imports the backend's bootstrap. Synced here, from the lock and with every group, as ci.yml
        # does, so the build runs in the environment the gates ran in.
        run: uv sync --locked --all-groups

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/gui/package-lock.json

      - name: Build the GUI
        working-directory: tools/gui
        run: |
          npm ci
          npm run build

      - name: Bundle the GUI and state the digests
        id: assets
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          tar -C tools/gui -czf "release/architectonic-gui-${version}.tar.gz" dist
          (cd release && sha256sum "architectonic-gui-${version}.tar.gz" > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/architectonic-gui-${{ steps.version.outputs.version }}.tar.gz
            release/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$version" \
            --notes-file "changelog-assets/${version}-detail.md" \
            "release/architectonic-gui-${version}.tar.gz" \
            release/SHA256SUMS
