name: Release

# Runs when a release tag is pushed. It publishes what `arch-update` verifies and installs: the built
# GUI bundle, a `SHA256SUMS` over every asset, and a build-provenance attestation for each. The tag's
# version must equal the project's, and the release notes are the changelog detail file the
# changelog gate already requires for every shipped version — so a release cannot reach the publish
# step without one. It publishes only from a commit whose CI passed: the run `main`'s push already made
# for this exact commit when there is one (waiting for it while it runs), and otherwise `ci.yml` run
# here on the tag. The gates themselves stay in `ci.yml`, which `AGENTS.md`'s list mirrors.
on:
  push:
    tags: ["v*"]

# Read-only by default; the publish job alone is granted what creating a release needs.
permissions:
  contents: read

jobs:
  main-ci-verdict:
    # A release is normally tagged on a commit `main` has just been pushed with, and CI has already run
    # every gate on it. Running them all again on the tag cost a second full CI per release. This job
    # finds that run — `ci.yml`, triggered by a push to `main`, for exactly this commit; a pull-request
    # run of the same commit does not count — and waits for it while it is in progress. Anything else
    # (no such run, a failure, a cancellation, the deadline) leaves `passed` false, and `ci` below runs.
    name: CI already passed on this commit?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    steps:
      - name: Find main's CI run for the tagged commit, waiting while it runs
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") echo "passed=true" >> "$GITHUB_OUTPUT"; echo "main's CI passed on ${GITHUB_SHA}"; exit 0 ;;
              ""|completed*) echo "passed=false" >> "$GITHUB_OUTPUT"; echo "no passing main CI run (${run:-none}); CI runs on the tag"; exit 0 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "passed=false" >> "$GITHUB_OUTPUT"; echo "main's CI still ${run} at the deadline; CI runs on the tag"; exit 0
            fi
            sleep 60
          done

  ci:
    # The whole of ci.yml on the tagged commit, when main's push has not already shown it green. A
    # failing job here leaves `publish` unrun.
    name: CI on the tagged commit
    needs: main-ci-verdict
    if: needs.main-ci-verdict.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # Codecov's upload token; nothing else in ci.yml reads a secret.
    secrets: inherit

  publish:
    name: Publish the release assets
    needs: [main-ci-verdict, ci]
    # `ci` is skipped when main's run already passed, so the condition names both ways to green and
    # nothing else: a failed or cancelled `ci` never publishes.
    if: ${{ !cancelled() && (needs.main-ci-verdict.outputs.passed == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        # libsqlcipher-dev: uv sync builds sqlcipher3 from source, as in ci.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: The tag names the project's version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python3 -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "tag $GITHUB_REF_NAME names $tag_version but pyproject.toml says $project_version" >&2
            exit 1
          fi
          test -f "changelog-assets/${project_version}-detail.md" || { echo "no changelog-assets/${project_version}-detail.md" >&2; exit 1; }
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python (.python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (all groups)
        # The GUI build regenerates the frontend types from the ontology through `uv run`, which
        # imports the backend's bootstrap. Synced here, from the lock and with every group, as ci.yml
        # does, so the build runs in the environment the gates ran in.
        run: uv sync --locked --all-groups

      - name: Set up Node (package.json engines)
        uses: actions/setup-node@v5
        with:
          node-version-file: tools/gui/package.json
          cache: npm
          cache-dependency-path: tools/gui/package-lock.json

      - name: Build the GUI
        working-directory: tools/gui
        run: |
          npm ci
          npm run build

      - name: Bundle the GUI and state the digests
        id: assets
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          tar -C tools/gui -czf "release/architectonic-gui-${version}.tar.gz" dist
          (cd release && sha256sum "architectonic-gui-${version}.tar.gz" > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/architectonic-gui-${{ steps.version.outputs.version }}.tar.gz
            release/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$version" \
            --notes-file "changelog-assets/${version}-detail.md" \
            "release/architectonic-gui-${version}.tar.gz" \
            release/SHA256SUMS
